<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>Style directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=Bodoni+Moda:opsz,wght@6..96,400;500&family=Jost:wght@300;400;500&display=swap">
<style>

/* Page chrome: a quiet frame around six styles. Each style's tokens live on its own tile. */
:root { --page:#f7f7f8; --ink:#16171a; --sub:#61646b; --rim:rgb(22 23 26 / .1); --chip:#ececee; --chip-on:#ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#08080a; --ink:#f1f1f3; --sub:#8e9097; --rim:rgb(255 255 255 / .08); --chip:#16171a; --chip-on:#26272b; color-scheme: dark; } }
:root[data-theme="dark"] { --page:#08080a; --ink:#f1f1f3; --sub:#8e9097; --rim:rgb(255 255 255 / .08); --chip:#16171a; --chip-on:#26272b; color-scheme: dark; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.head h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.head p { margin: 6px 0 0; max-width: 62ch; color: var(--sub); text-wrap: pretty; }
.modes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); }
.modes button { border: 0; background: transparent; color: var(--sub); font: 500 12.5px/1 Inter, system-ui, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--chip-on); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.modes button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 20px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; }
figcaption { padding: 12px 4px 0; }
figcaption b { font-weight: 600; letter-spacing: -0.01em; }
figcaption span { display: block; color: var(--sub); font-size: 13px; text-wrap: pretty; }

/* A style's tile: its ground, and the same composition on it. */
.st { flex: 1; position: relative; border-radius: 18px; padding: 28px 24px; background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--rim); overflow: hidden; }
.st * { box-sizing: border-box; }
.st p, .st h3, .st ul { margin: 0; padding: 0; }
.st ul { list-style: none; }
.st input { width: 100%; min-width: 0; font: inherit; color: var(--fg); background: transparent; outline: none; }
.st button { font: inherit; cursor: pointer; white-space: nowrap; }
.st kbd { display: none; }
.st .top { display: flex; align-items: center; gap: 8px; }
.st .mark { display: grid; place-items: center; flex: none; }
.st .tabs { margin-left: auto; display: flex; }
.st .tabs a { cursor: pointer; white-space: nowrap; }
.st .row { display: flex; gap: 8px; }
.st .list li { display: flex; align-items: center; gap: 10px; }
.st .who { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.st .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.st .sw { display: inline-flex; align-items: center; gap: 10px; }
.st .track { position: relative; display: inline-block; flex: none; }
.st .track i { position: absolute; }
.st :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---- Minimal: today's look, the reference ---- */
.st-minimal { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
.st-minimal .panel { background: var(--panel); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .04), 0 10px 28px -10px rgb(0 0 0 / .14); }
.st-minimal .top { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 600; }
.st-minimal .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--onbrand); font-size: 11px; }
.st-minimal .tabs { gap: 2px; padding: 2px; border-radius: 8px; background: var(--soft); }
.st-minimal .tabs a { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.st-minimal .tabs a.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 1px var(--line); }
.st-minimal .body { padding: 18px 16px 16px; }
.st-minimal .eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); }
.st-minimal .title { margin-top: 2px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.st-minimal .lede { margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.st-minimal .field { margin-top: 16px; }
.st-minimal label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 500; }
.st-minimal input { height: 36px; padding: 0 12px; border: 1px solid var(--strong); border-radius: 8px; font-size: 13.5px; }
.st-minimal .btn { height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; border: 0; }
.st-minimal .pri { background: var(--brand); color: var(--onbrand); box-shadow: inset 0 1px 0 rgb(255 255 255 / .16), 0 1px 2px rgb(0 0 0 / .12); }
.st-minimal .sec { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--strong), 0 1px 2px rgb(0 0 0 / .05); }
.st-minimal .list { margin-top: 14px; }
.st-minimal .list li { padding: 9px 0; border-top: 1px solid var(--line); }
.st-minimal .av { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: 10.5px; font-weight: 600; flex: none; }
.st-minimal .who b { font-size: 13.5px; font-weight: 500; }
.st-minimal .who small { font-size: 12px; color: var(--muted); }
.st-minimal .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--soft); }
.st-minimal .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.st-minimal .tag.ok::before { background: var(--ok); }
.st-minimal .foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.st-minimal .track { width: 32px; height: 18px; border-radius: 999px; background: var(--brand); }
.st-minimal .track i { left: 16px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); }

/* ---- Editorial: a page, not a card ---- */
.st-editorial { font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
.st-editorial .top { padding-bottom: 10px; border-bottom: 2px solid var(--line); }
.st-editorial .mark { display: none; }
.st-editorial .name { font: 400 24px/1 "Instrument Serif", Georgia, serif; letter-spacing: -0.01em; }
.st-editorial .tabs { gap: 16px; }
.st-editorial .tabs a { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.st-editorial .tabs a.on { color: var(--fg); box-shadow: inset 0 -1px 0 var(--fg); }
.st-editorial .body { padding-top: 20px; }
.st-editorial .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
.st-editorial .title { margin-top: 6px; font: 400 42px/1 "Instrument Serif", Georgia, serif; letter-spacing: -0.015em; }
.st-editorial .lede { margin-top: 8px; font-size: 15px; color: var(--muted); }
.st-editorial .field { margin-top: 22px; }
.st-editorial label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.st-editorial .row { align-items: end; gap: 14px; }
.st-editorial input { height: 40px; padding: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 16px; }
.st-editorial .btn { border: 0; font-size: 13px; font-weight: 600; }
.st-editorial .pri { height: 40px; padding: 0 18px; background: var(--brand); color: var(--onbrand); border-radius: 0; }
.st-editorial .sec { background: none; color: var(--fg); padding: 0; text-decoration: underline; text-underline-offset: 4px; }
.st-editorial .sec::after { content: " →"; text-decoration: none; display: inline-block; margin-left: 4px; }
.st-editorial .list { margin-top: 20px; border-top: 1px solid var(--line); }
.st-editorial .list li { padding: 10px 0; border-bottom: 1px solid var(--strong); }
.st-editorial .av { display: none; }
.st-editorial .who b { font: 400 20px/1.15 "Instrument Serif", Georgia, serif; }
.st-editorial .who small { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.st-editorial .tag { font: italic 400 16px/1 "Instrument Serif", Georgia, serif; color: var(--muted); }
.st-editorial .tag.wait { color: var(--brand); }
.st-editorial .foot { margin-top: 14px; font-size: 13.5px; }
.st-editorial .track { width: 30px; height: 16px; border-radius: 999px; border: 1px solid var(--fg); }
.st-editorial .track i { left: 15px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); }

/* ---- Technical: drawn on a grid ---- */
.st-technical { font-family: Geist, ui-sans-serif, system-ui, sans-serif; background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 12px 12px; background-position: -6px -6px; }
.st-technical .panel { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }
.st-technical .panel::before { --tk: var(--strong); content: ""; position: absolute; inset: -7px; pointer-events: none;
  background: linear-gradient(var(--tk),var(--tk)) left top/9px 1px no-repeat, linear-gradient(var(--tk),var(--tk)) left top/1px 9px no-repeat,
  linear-gradient(var(--tk),var(--tk)) right top/9px 1px no-repeat, linear-gradient(var(--tk),var(--tk)) right top/1px 9px no-repeat,
  linear-gradient(var(--tk),var(--tk)) left bottom/9px 1px no-repeat, linear-gradient(var(--tk),var(--tk)) left bottom/1px 9px no-repeat,
  linear-gradient(var(--tk),var(--tk)) right bottom/9px 1px no-repeat, linear-gradient(var(--tk),var(--tk)) right bottom/1px 9px no-repeat; }
.st-technical .top { padding: 10px 12px; border-bottom: 1px dashed var(--line); font-size: 13px; font-weight: 600; }
.st-technical .mark { width: 18px; height: 18px; border-radius: 1px; background: var(--brand); color: var(--onbrand); font: 600 10px/1 "Geist Mono", ui-monospace, monospace; }
.st-technical .tabs a { font: 500 10.5px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border: 1px solid var(--line); margin-left: -1px; }
.st-technical .tabs a.on { background: var(--fg); color: var(--panel); border-color: var(--fg); position: relative; }
.st-technical .body { padding: 14px 12px 12px; }
.st-technical .eyebrow { font: 500 10.5px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.st-technical .eyebrow::before { content: "// "; }
.st-technical .title { margin-top: 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.st-technical .lede { margin-top: 2px; font-size: 13px; color: var(--muted); }
.st-technical .field { margin-top: 14px; }
.st-technical label { display: block; margin-bottom: 6px; font: 500 10.5px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st-technical .row { gap: 6px; }
.st-technical input { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 2px; font: 12.5px "Geist Mono", ui-monospace, monospace; }
.st-technical .btn { height: 32px; padding: 0 12px; border-radius: 2px; font: 500 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; }
.st-technical .pri { background: var(--brand); color: var(--onbrand); border-color: var(--brand); }
.st-technical .sec { background: var(--panel); color: var(--fg); }
.st-technical kbd { display: inline-block; padding: 2px 4px; border: 1px solid var(--line); border-radius: 2px; font: 10px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); text-transform: none; letter-spacing: 0; }
.st-technical .list { margin-top: 14px; border: 1px solid var(--line); }
.st-technical .list li { padding: 7px 10px; }
.st-technical .list li + li { border-top: 1px solid var(--line); }
.st-technical .av { display: none; }
.st-technical .who { flex-direction: row; align-items: baseline; gap: 10px; }
.st-technical .who b { font-size: 13px; font-weight: 500; }
.st-technical .who small { font: 11px "Geist Mono", ui-monospace, monospace; color: var(--muted); }
.st-technical .tag { font: 500 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; padding: 3px 5px; border: 1px solid var(--line); border-radius: 1px; color: var(--muted); }
.st-technical .tag.ok { color: var(--ok); border-color: currentColor; }
.st-technical .tag.wait { border-style: dashed; }
.st-technical .foot { margin-top: 12px; font-size: 12.5px; }
.st-technical .track { width: 30px; height: 16px; border: 1px solid var(--brand); border-radius: 1px; background: color-mix(in oklab, var(--brand) 18%, transparent); }
.st-technical .track i { left: 16px; top: 2px; width: 10px; height: 10px; background: var(--brand); }

/* ---- Soft: rounded and filled ---- */
.st-soft { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
.st-soft .panel { background: var(--panel); border-radius: 24px; box-shadow: 0 1px 2px rgb(20 26 46 / .04), 0 20px 44px -18px color-mix(in oklab, var(--brand) 45%, transparent); }
.st-soft .top { padding: 14px 16px 4px 18px; font-size: 14px; font-weight: 700; }
.st-soft .mark { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--onbrand); font-size: 11.5px; }
.st-soft .tabs { gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); }
.st-soft .tabs a { padding: 5px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.st-soft .tabs a.on { background: var(--panel); color: var(--fg); box-shadow: 0 2px 6px -2px rgb(20 26 46 / .18); }
.st-soft .body { padding: 14px 18px 18px; }
.st-soft .eyebrow { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--tint); color: var(--brand); font-size: 11.5px; font-weight: 700; }
.st-soft .title { margin-top: 8px; font-size: 21px; font-weight: 700; letter-spacing: -0.025em; }
.st-soft .lede { margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.st-soft .field { margin-top: 14px; }
.st-soft label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
.st-soft input { height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--soft); font-size: 14px; box-shadow: inset 0 1px 2px rgb(0 0 0 / .06); }
.st-soft .btn { height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 700; }
.st-soft .pri { background: var(--brand); color: var(--onbrand); box-shadow: 0 8px 18px -8px var(--brand); }
.st-soft .sec { background: var(--tint); color: var(--brand); }
.st-soft .list { margin-top: 12px; display: grid; gap: 6px; }
.st-soft .list li { padding: 8px 10px; border-radius: 16px; background: var(--soft); }
.st-soft .av { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--tint); color: var(--brand); font-size: 11px; font-weight: 800; flex: none; }
.st-soft .who b { font-size: 13.5px; font-weight: 700; }
.st-soft .who small { font-size: 12px; color: var(--muted); }
.st-soft .tag { padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--panel); color: var(--muted); }
.st-soft .tag.ok { background: var(--oktint); color: var(--ok); }
.st-soft .foot { margin-top: 14px; font-size: 13px; font-weight: 600; }
.st-soft .foot .btn { height: 36px; padding: 0 14px; font-size: 13px; }
.st-soft .track { width: 42px; height: 26px; border-radius: 999px; background: var(--brand); }
.st-soft .track i { left: 19px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgb(0 0 0 / .2); }

/* ---- Graphic: color as a block, ink outlines ---- */
.st-graphic { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; }
.st-graphic .panel { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); }
.st-graphic .top { padding: 12px 14px; border-bottom: 1.5px solid var(--ink); font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
.st-graphic .mark { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--brand); color: #fff; font-size: 12px; }
.st-graphic .tabs { gap: 4px; }
.st-graphic .tabs a { padding: 3px 9px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 12px; font-weight: 700; }
.st-graphic .tabs a.on { background: var(--ink); color: var(--panel); }
.st-graphic .body { padding: 16px 14px 14px; }
.st-graphic .eyebrow { font-size: 12px; font-weight: 700; color: var(--brand); }
.st-graphic .title { margin-top: 2px; font-size: 26px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
.st-graphic .lede { margin-top: 4px; font-size: 14px; color: var(--muted); }
.st-graphic .field { margin-top: 14px; }
.st-graphic label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
.st-graphic input { height: 40px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 10px; font-size: 14px; }
.st-graphic .btn { height: 40px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 10px; font-size: 14px; font-weight: 700; }
.st-graphic .pri { background: var(--brand); color: #fff; box-shadow: 3px 3px 0 var(--ink); }
.st-graphic .sec { background: var(--panel); color: var(--fg); }
.st-graphic .list { margin-top: 14px; }
.st-graphic .list li { padding: 8px 0; border-top: 1.5px solid color-mix(in oklab, var(--ink) 14%, transparent); }
.st-graphic .av { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--soft); color: var(--fg); font-size: 11px; font-weight: 800; flex: none; }
.st-graphic .who b { font-size: 14px; font-weight: 700; }
.st-graphic .who small { font-size: 12px; color: var(--muted); }
.st-graphic .tag { padding: 2px 9px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--panel); }
.st-graphic .tag.ok { background: var(--ok); color: #0e0e10; }
.st-graphic .foot { margin-top: 12px; font-size: 13.5px; font-weight: 600; }
.st-graphic .track { width: 40px; height: 24px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--brand); }
.st-graphic .track i { left: 18px; top: 2px; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; }

/* ---- Luxe: black and white, color held back ---- */
.st-luxe { font-family: Jost, ui-sans-serif, system-ui, sans-serif; font-weight: 400; }
.st-luxe .top { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.st-luxe .mark { display: none; }
.st-luxe .name { font: 500 15px/1 "Bodoni Moda", Didot, serif; letter-spacing: .28em; text-transform: uppercase; }
.st-luxe .tabs { gap: 14px; }
.st-luxe .tabs a { font-size: 9.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); padding-bottom: 3px; }
.st-luxe .tabs a.on { color: var(--fg); box-shadow: inset 0 -1px 0 var(--fg); }
.st-luxe .body { padding-top: 22px; }
.st-luxe .eyebrow { font-size: 9.5px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
.st-luxe .title { margin-top: 10px; font: 400 38px/1.02 "Bodoni Moda", Didot, serif; letter-spacing: -0.01em; }
.st-luxe .lede { margin-top: 8px; font-size: 14px; font-weight: 300; color: var(--muted); }
.st-luxe .field { margin-top: 22px; }
.st-luxe label { display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.st-luxe .row { align-items: end; gap: 16px; }
.st-luxe input { height: 40px; padding: 0; border: 0; border-bottom: 1px solid var(--strong); border-radius: 0; font-size: 15px; font-weight: 300; }
.st-luxe .btn { height: 42px; padding: 0 22px; border-radius: 0; font-size: 10px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; }
.st-luxe .pri { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); }
.st-luxe .sec { background: transparent; color: var(--fg); border: 1px solid var(--strong); }
.st-luxe .list { margin-top: 22px; }

<script>
  // Light and Dark set the page's theme the same way the viewer does, so both can be compared here.
  const root = document.documentElement, buttons = document.querySelectorAll(".modes button");
  const current = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const paint = () => buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === current())));
  buttons.forEach((b) => b.addEventListener("click", () => { root.dataset.theme = b.dataset.mode; paint(); }));
  paint();
  // The switches in the tiles flip, so they read as controls.
  document.querySelectorAll(".track").forEach((t) => {
    const flip = () => { const on = t.getAttribute("aria-checked") !== "true"; t.setAttribute("aria-checked", String(on)); t.querySelector("i").style.translate = on ? "0" : "-14px"; t.style.opacity = on ? "1" : ".55"; };
    t.addEventListener("click", flip);
    t.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
  });
</script>
