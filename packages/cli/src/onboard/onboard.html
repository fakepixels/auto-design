<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>auto-design</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23262626'/%3E%3Cpath d='M9 23 23 9v14z' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/renderer.css">
<link rel="stylesheet" href="/chrome-fonts.css">
<style>
  /*
   * The room around your product. Everything here is neutral on purpose:
   * your brand is the only color on the screen, the way a color-proofing
   * booth keeps its walls gray so colors are judged honestly.
   */
  :root {
    --booth: oklch(0.905 0 0);
    --paper: oklch(0.99 0 0);
    --ink: oklch(0.2 0 0);
    --graphite: oklch(0.47 0 0);
    --faint: oklch(0.64 0 0);
    --rule: oklch(0.9 0 0);
    --wash: oklch(0.2 0 0 / 0.045);
    --wash-2: oklch(0.2 0 0 / 0.08);
    --pass: oklch(0.52 0.12 150);
    --fail: oklch(0.55 0.17 27);
    --frame-shadow: 0 1px 1px oklch(0 0 0 / 0.06), 0 12px 32px -14px oklch(0 0 0 / 0.32);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --display: "Funnel Display", "Funnel Display Variable", ui-sans-serif, system-ui, sans-serif;
    --sans: "Funnel Sans", "Funnel Sans Variable", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --booth: oklch(0.255 0 0);
      --paper: oklch(0.18 0 0);
      --ink: oklch(0.96 0 0);
      --graphite: oklch(0.72 0 0);
      --faint: oklch(0.55 0 0);
      --rule: oklch(0.29 0 0);
      --wash: oklch(1 0 0 / 0.05);
      --wash-2: oklch(1 0 0 / 0.09);
      --pass: oklch(0.72 0.14 150);
      --fail: oklch(0.72 0.15 27);
      --frame-shadow: 0 1px 1px oklch(0 0 0 / 0.4), 0 16px 40px -14px oklch(0 0 0 / 0.7);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  a { color: inherit; text-underline-offset: 3px; }
  code { font-family: var(--mono); font-size: 0.92em; }

  /* ---------- Top bar ---------- */
  .top { height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 20px; border-bottom: 1px solid var(--rule); background: var(--paper); position: relative; z-index: 5; }
  .mark { display: flex; align-items: center; gap: 10px; font: 600 17px/1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
  .mark svg { display: block; }
  .tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { position: relative; height: 56px; padding: 0 10px; border: 0; background: none; color: var(--faint); font-size: 13.5px; white-space: nowrap; }
  .tabs button.seen { color: var(--graphite); }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-current="step"] { color: var(--ink); font-weight: 500; }
  .tabs button[aria-current="step"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
  .top-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .quiet { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--graphite); font-size: 13.5px; }
  .quiet:hover { background: var(--wash); color: var(--ink); }
  .model { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: none; color: var(--graphite); font-size: 13px; white-space: nowrap; }
  .model i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .model.on { color: var(--ink); }
  .model.on i { background: var(--pass); }

  /* ---------- Room: the swatchbook and the stage ---------- */
  .room { display: grid; grid-template-columns: 424px minmax(0, 1fr); height: calc(100vh - 56px); }
  .book { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: var(--paper); }
  .book-scroll { flex: 1; overflow-y: auto; padding: 36px 32px 28px; }
  .book-foot { display: flex; align-items: center; gap: 8px; padding: 14px 24px 14px 32px; border-top: 1px solid var(--rule); }
  .status { margin-right: auto; color: var(--graphite); font-size: 13px; line-height: 1.35; min-width: 0; }
  .status.err { color: var(--fail); }

  .q { margin: 0; font: 600 34px/1.06 var(--display); letter-spacing: -0.022em; text-wrap: balance; }
  .help { margin: 12px 0 0; color: var(--graphite); font-size: 14.5px; line-height: 1.5; max-width: 40ch; text-wrap: pretty; }
  .block { margin-top: 28px; }
  .block-title { margin: 28px 0 10px; font-size: 13px; font-weight: 500; color: var(--graphite); }
  .block-title + .swatches { margin-top: 0; }

  /* Buttons */
  .ink { height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 500; white-space: nowrap; transition: transform 140ms var(--ease), opacity 140ms; }
  .ink:hover:not(:disabled) { opacity: 0.88; }
  .ink:active:not(:disabled) { transform: scale(0.97); }
  .ink:disabled { opacity: 0.3; cursor: default; }
  .ink.sm { height: 34px; padding: 0 14px; font-size: 13.5px; border-radius: 9px; }
  .line { height: 34px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 9px; background: none; font-size: 13.5px; white-space: nowrap; transition: background-color 140ms; }
  .line:hover { background: var(--wash); }
  .text-btn { border: 0; background: none; padding: 0; color: var(--graphite); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
  .text-btn:hover { color: var(--ink); }

  /* Fields */
  .field { display: grid; gap: 6px; margin-top: 18px; }
  .field > span { font-size: 13px; font-weight: 500; }
  .field > small, .note { color: var(--graphite); font-size: 13px; line-height: 1.45; margin: 0; }
  .input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); transition: border-color 140ms, box-shadow 140ms; }
  .input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--wash-2); }
  .input.mono { font-family: var(--mono); font-size: 13px; }
  .name-input { width: 100%; border: 0; border-bottom: 1.5px solid var(--rule); background: none; padding: 6px 0 10px; font: 600 30px/1.1 var(--display); letter-spacing: -0.02em; border-radius: 0; transition: border-color 160ms; }
  .name-input::placeholder { color: var(--faint); }
  .name-input:focus { outline: none; border-color: var(--ink); }
  textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
  .error { color: var(--fail); font-size: 13px; margin: 6px 0 0; }
  .ok { color: var(--pass); font-size: 13px; margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; justify-self: start; padding: 3px; border-radius: 10px; background: var(--wash); }
  .seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--graphite); font-size: 13px; white-space: nowrap; transition: background-color 160ms var(--ease), color 160ms; }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px oklch(0 0 0 / 0.14); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
  .check input { margin: 3px 0 0; accent-color: var(--ink); }

  details.more { margin-top: 26px; border-top: 1px solid var(--rule); }
  details.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 0 0; font-weight: 500; cursor: pointer; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--graphite); border-bottom: 1.5px solid var(--graphite); transform: rotate(45deg) translateY(-3px); transition: transform 200ms var(--ease); }
  details.more[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
  details.more > summary small { display: block; font-weight: 400; color: var(--graphite); font-size: 13px; margin-top: 2px; }
  details.more > .inner { padding-top: 4px; }

  /* ---------- Swatches ---------- */
  .swatches { display: grid; gap: 2px; margin-top: 24px; }
  .sw { display: grid; grid-template-columns: 64px minmax(0, 1fr) 18px; gap: 14px; align-items: center; width: 100%; padding: 8px 10px 8px 8px; border: 0; border-radius: 12px; background: none; text-align: left; transition: background-color 160ms var(--ease); }
  .sw:hover, .sw:focus-visible { background: var(--wash); }
  .sw:focus-visible { outline-offset: 0; }
  .sw[aria-checked="true"] { background: var(--wash-2); }
  .sw b { display: block; font-weight: 500; font-size: 14.5px; }
  .sw .sw-note { display: block; color: var(--graphite); font-size: 13px; line-height: 1.4; margin-top: 1px; }
  .sw .tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; opacity: 0; transform: scale(0.6); transition: opacity 160ms var(--ease), transform 220ms var(--ease); background: var(--ink); }
  .sw .tick::after { content: ""; width: 7px; height: 4px; border: 1.8px solid var(--paper); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .sw[aria-checked="true"] .tick { opacity: 1; transform: none; }
  .sw.err { opacity: 0.5; cursor: not-allowed; }
  .swatches.loading .sw { pointer-events: none; }
  .swatches.loading .smp { background: var(--wash) !important; }
  .swatches.loading .smp > * { visibility: hidden; }

  /* Samples: each one is drawn in the option's own system. */
  .smp { position: relative; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.08); display: grid; place-items: center; }
  .smp.sp { background: var(--background); color: var(--foreground); font-family: var(--sp-sans); }
  .smp-aa { font-family: var(--sp-display, var(--sp-sans)) !important; font-weight: var(--sp-w-display); font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
  .smp-preset .dot { position: absolute; left: 9px; bottom: 9px; width: 14px; height: 14px; border-radius: min(var(--sp-r), 7px); background: var(--primary); }
  .smp-preset .aa { position: absolute; right: 9px; top: 7px; font-family: var(--sp-display, var(--sp-sans)); font-weight: var(--sp-w-display); font-size: 24px; line-height: 1; letter-spacing: -0.02em; }
  .smp-preset .bar { position: absolute; right: 9px; bottom: 11px; width: 26px; height: 3px; border-radius: 2px; background: var(--muted-foreground); opacity: 0.45; }
  .smp-tex { background: var(--muted) !important; }
  .smp-tex[data-texture="glass"] { background: radial-gradient(70% 70% at 20% 15%, color-mix(in oklab, var(--primary) 34%, transparent), transparent 70%), radial-gradient(60% 60% at 90% 90%, color-mix(in oklab, var(--chart-2) 30%, transparent), transparent 70%), var(--background) !important; }
  .smp-tex .card { position: absolute; left: 9px; top: 12px; width: 34px; height: 38px; border-radius: min(var(--sp-r), 9px); background: var(--card); border: 1px solid var(--sp-card-border, var(--border)); box-shadow: var(--sp-card-shadow); }
  .smp-tex .pop { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 24px; border-radius: min(var(--sp-r), 8px); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--sp-shadow-lg); }
  .smp-tex[data-texture="glass"] .pop { background: color-mix(in oklab, var(--popover) 60%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-color: color-mix(in oklab, var(--foreground) 12%, transparent); }
  .smp-tex[data-texture="editorial"] .card { border-color: transparent; box-shadow: none; }
  .smp-tex[data-texture="tactile"] .card { border-color: transparent; }
  .smp-tex[data-texture="technical"] .card::after { content: ""; position: absolute; left: 5px; top: 6px; width: 14px; height: 2px; background: var(--muted-foreground); opacity: 0.6; }
  .smp-radius { background: var(--muted) !important; }
  .smp-radius .shape { width: 36px; height: 36px; background: var(--card); border: 1.5px solid var(--foreground); }
  .smp-density { background: var(--muted) !important; align-content: center; gap: var(--gap); padding: 0 12px; }
  .smp-density i { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--muted-foreground); opacity: 0.55; }
  .smp-motion { background: var(--muted) !important; }
  .smp-motion i { position: absolute; left: 12px; top: 26px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
  .sw:hover .smp-motion i, .sw:focus-visible .smp-motion i, .sw[aria-checked="true"] .smp-motion i { animation: smp-move calc(var(--sp-base) * 2.4) var(--sp-ease-in-out) infinite alternate; }
  .smp-motion[data-still] i { animation-name: smp-fade !important; }
  @keyframes smp-move { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(28px); } }
  @keyframes smp-fade { 0%, 30% { opacity: 1; } 50% { opacity: 0.25; } 70%, 100% { opacity: 1; } }
  .smp-surface { background: var(--wash) !important; box-shadow: none; color: var(--graphite); }
  .smp-surface svg { width: 28px; height: 28px; }
  .sw[role="checkbox"][aria-checked="true"] .smp-surface { background: var(--ink) !important; color: var(--paper); }
  .sw[role="checkbox"] .tick { border-radius: 5px; }

  /* ---------- Color ---------- */
  .picker { display: grid; gap: 12px; margin-top: 24px; }
  .area-wrap { position: relative; width: 100%; aspect-ratio: 360 / 220; border-radius: 12px; overflow: hidden; touch-action: none; cursor: crosshair; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.08); }
  .area-wrap canvas, .hue-wrap canvas { display: block; width: 100%; height: 100%; }
  .marker { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 0 0 1px oklch(0 0 0 / 0.35), 0 2px 8px oklch(0 0 0 / 0.3); pointer-events: none; transition: transform 160ms var(--ease); }
  .area-wrap:active .marker { transform: scale(1.15); }
  .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: -4px; }
  .hue-wrap { position: relative; height: 14px; border-radius: 7px; touch-action: none; cursor: ew-resize; }
  .hue-wrap canvas { border-radius: 7px; }
  .knob { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px oklch(0 0 0 / 0.3), 0 1px 5px oklch(0 0 0 / 0.3); pointer-events: none; }
  .code-row { display: flex; gap: 8px; align-items: center; }
  .chipcolor { width: 40px; height: 40px; border-radius: 10px; flex: none; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.12); }
  .icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 10px; background: none; }
  .icon-btn:hover { background: var(--wash); }
  .starters { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .starters button { aspect-ratio: 1; border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.12); transition: transform 160ms var(--ease); }
  .starters button:hover { transform: scale(1.12); }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
  .scale div { height: 24px; border-radius: 5px; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.06); }
  .scale div.seed { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }
  .checks { font-size: 13px; color: var(--graphite); }
  .checks b { color: var(--pass); font-weight: 500; }
  .checks ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 3px; }

  /* Dials */
  .dial { display: grid; gap: 6px; padding: 12px 0; }
  .dial .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--graphite); }
  .dial input { width: 100%; accent-color: var(--ink); }

  /* Material */
  .drop { border: 1.5px dashed var(--rule); border-radius: 12px; padding: 16px; text-align: center; color: var(--graphite); font-size: 13px; cursor: pointer; margin-top: 8px; transition: border-color 160ms, background-color 160ms; }
  .drop.over, .drop:hover { border-color: var(--graphite); background: var(--wash); }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--rule); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 999px; background: none; font-size: 13px; white-space: nowrap; transition: background-color 140ms, border-color 140ms; }
  .chip:hover { background: var(--wash); }
  .chip i { width: 14px; height: 14px; margin-left: -4px; border-radius: 50%; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.12); }
  .chip[aria-pressed="true"] { border-color: var(--ink); }
  .reasons { margin: 6px 0 0; padding-left: 16px; color: var(--graphite); font-size: 13px; display: grid; gap: 3px; }

  /* Choices (providers, hosting) */
  .choices { display: grid; gap: 6px; }
  .choice { display: grid; gap: 1px; text-align: left; padding: 11px 13px; border: 1px solid var(--rule); border-radius: 11px; background: none; transition: border-color 140ms, background-color 140ms; }
  .choice:hover { background: var(--wash); }
  .choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .choice b { font-weight: 500; }
  .choice span { color: var(--graphite); font-size: 13px; }
  .choice em { font-style: normal; color: var(--pass); font-size: 12.5px; }

  /* Review */
  .history { display: grid; gap: 10px; margin-top: 16px; }
  .history div { font-size: 13px; color: var(--graphite); }
  .history div b { display: block; color: var(--ink); font-weight: 500; }

  /* Done */
  .steps-out { display: grid; gap: 12px; margin-top: 24px; }
  .steps-out > div { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 13.5px; }
  .steps-out i { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; background: var(--pass); position: relative; }
  .steps-out i::after { content: ""; position: absolute; left: 5px; top: 5px; width: 7px; height: 4px; border: 1.8px solid var(--paper); border-top: 0; border-right: 0; transform: rotate(-45deg); }
  .steps-out .bad i { background: var(--fail); }
  .steps-out .bad i::after { left: 8px; top: 4px; width: 0; height: 8px; border-width: 0 0 0 2px; transform: none; }
  .steps-out small { display: block; color: var(--graphite); font-size: 13px; word-break: break-word; }
  pre.cmd { margin: 0; padding: 11px 13px; border-radius: 10px; background: var(--wash); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .copy-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; margin-top: 8px; }

  /* ---------- Stage ---------- */
  .stage { position: relative; min-width: 0; min-height: 0; background: var(--booth); overflow: hidden; }
  .stage-scroll { position: absolute; inset: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 44px 40px 84px; }
  .stage.fit .stage-scroll { align-items: center; }
  .board-size { flex: none; position: relative; }
  .board { position: absolute; left: 0; top: 0; width: 1280px; transform-origin: 0 0; display: grid; gap: 28px; }
  .stage-tools { position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .stage-tools > * { pointer-events: auto; }
  .stage-tools .seg { background: color-mix(in oklab, var(--paper) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 2px oklch(0 0 0 / 0.1); }
  .stage-note { margin-left: auto; padding: 6px 12px; border-radius: 999px; background: color-mix(in oklab, var(--paper) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 13px; color: var(--graphite); box-shadow: 0 1px 2px oklch(0 0 0 / 0.1); opacity: 0; transform: translateY(4px); transition: opacity 180ms var(--ease), transform 220ms var(--ease); }
  .stage-note.on { opacity: 1; transform: none; }

  /* Frames: windows, a phone and panels, holding your product. */
  .fr { position: relative; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--paper); box-shadow: var(--frame-shadow); display: flex; flex-direction: column; }
  .fr-bar { flex: none; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: color-mix(in oklab, var(--paper) 94%, var(--ink)); border-bottom: 1px solid var(--rule); }
  .fr-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); }
  .fr-bar .url { flex: 0 1 300px; margin: 0 auto; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--wash); color: var(--graphite); font-size: 11.5px; overflow: hidden; white-space: nowrap; }
  .fr-bar .title { margin-left: 6px; color: var(--graphite); font-size: 12px; }
  .fr-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .fr-body > .sp { min-height: 100%; }
  .fr.phone { border-radius: 46px; padding: 11px; background: oklch(0.16 0 0); box-shadow: inset 0 0 0 1.5px oklch(0.32 0 0), var(--frame-shadow); }
  .fr.phone .fr-body { border-radius: 36px; background: #fff; }
  .fr.phone .island { position: absolute; z-index: 2; top: 20px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 13px; background: oklch(0.16 0 0); }
  .fr.phone .fr-body > .sp { padding-top: 44px; }
  .fr.phone .fr-body > .sp[data-mode="dark"] { background: #000; }
  .fr.phone .fr-body > .sp[data-mode="light"] { background: #fff; }
  .fr.panel .fr-body { padding: 0; }
  .fr.label-under { overflow: visible; background: none; box-shadow: none; }

  /* Changes to a system cross-fade on the stage. */
  .fr-body .sp, .fr-body .sp *:not(.sp-stage):not(.sp-stage *) {
    transition: background-color 340ms var(--ease), color 340ms var(--ease), border-color 340ms var(--ease), border-radius 340ms var(--ease), box-shadow 340ms var(--ease), fill 340ms var(--ease);
  }
  .fr.enter { animation: fr-in 720ms var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes fr-in { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }

  /* Layouts: frames take their content's height; the phone spans the column. */
  /* Frames in a row share their edges, so the board reads as one composed sheet. */
  .board > .fr { align-self: stretch; }
  .fr.fill .fr-body > .sp { height: 100%; }
  .lay-board, .lay-review { grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "hero side" "app side"; }
  .lay-board.split, .lay-review.split { grid-template-areas: "hero side" "app side2"; }
  .lay-focus { grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "main side" "sub side"; }
  .lay-focus.split { grid-template-areas: "main side" "sub side2"; }
  .lay-color { grid-template-columns: 1fr 1fr; grid-template-areas: "light dark" "hero hero"; }
  .board .fr.phone { grid-row: span 2; align-self: stretch; min-height: 780px; }
  .lay-review .extra { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
  .lay-review .extra .fr.wide { grid-column: 1 / -1; }
  .lay-review .extra .fr.wide .fr-body { height: 380px; }
  .lay-compare { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 28px; }
  .tile { all: unset; display: grid; gap: 10px; cursor: pointer; }
  .tile .fr { height: 340px; align-self: stretch; transition: box-shadow 200ms var(--ease), transform 200ms var(--ease); }
  .tile:hover .fr { transform: translateY(-3px); }
  .tile[aria-pressed="true"] .fr { box-shadow: 0 0 0 3px var(--ink), var(--frame-shadow); }
  .tile .lbl { font: 500 19px/1.3 var(--sans); color: var(--ink); padding-left: 2px; }
  .tile .lbl small { display: block; font-weight: 400; color: var(--graphite); font-size: 16px; }
  .tile:focus-visible .fr { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* Narrow screens: one column of frames, drawn larger, scrolling inside the stage. */
  .board.narrow { grid-template-columns: minmax(0, 1fr) !important; grid-template-areas: none !important; gap: 20px; }
  .board.narrow > .fr, .board.narrow .extra > .fr { grid-area: auto !important; grid-row: auto !important; }
  .board.narrow .fr.phone { justify-self: center; width: 360px; min-height: 0; height: 740px; }
  .board.narrow .extra { grid-template-columns: minmax(0, 1fr) !important; }

  @media (max-width: 1080px) {
    /* Stage on top, choices below, each scrolling on its own: picking an option always shows on the stage. */
    .room { grid-template-columns: 1fr; grid-template-rows: 48dvh minmax(0, 1fr); height: calc(100dvh - 56px); }
    .stage { order: -1; height: auto; min-height: 0; }
    .book { border-right: 0; border-top: 1px solid var(--rule); }
    .book-scroll { padding: 28px 20px; }
    .book-foot { padding: 12px 20px; }
    .stage-scroll { padding: 20px 16px 72px; }
    .stage-tools { left: 12px; right: 12px; bottom: 10px; }
  }
  @media (max-width: 640px) {
    .top { gap: 12px; padding: 0 12px; }
    .mark span { display: none; }
    .room { grid-template-rows: 42dvh minmax(0, 1fr); }
    #compare-seg { display: none !important; }
    .q { font-size: 30px; }
    .model span { display: none; }
    .stage-note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<header class="top">
  <span class="mark"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 23 23 9v14z" fill="var(--paper)"/></svg><span>auto-design</span></span>
  <nav class="tabs" id="tabs" aria-label="Steps"></nav>
  <div class="top-end">
    <button class="quiet" id="undo" hidden>Undo</button>
    <button class="model" id="model-pill" title="Connect a model on the first step"><i></i><span>No model</span></button>
  </div>
</header>

<div class="room">
  <section class="book" aria-label="Choices">
    <div class="book-scroll" id="book" tabindex="-1"></div>
    <footer class="book-foot">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <button class="quiet" id="back">Back</button>
      <button class="ink" id="next">Continue</button>
    </footer>
  </section>
  <main class="stage fit" id="stage" aria-label="Your product, previewed with your choices">
    <div class="stage-scroll" id="stage-scroll"><div class="board-size" id="board-size"><div class="board" id="board"></div></div></div>
    <div class="stage-tools">
      <div class="seg" id="stage-mode" role="group" aria-label="Preview mode"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
      <div class="seg" id="compare-seg" role="group" aria-label="Preview layout" hidden><button data-v="board" aria-pressed="true">Your product</button><button data-v="compare" aria-pressed="false">Compare all</button></div>
      <span class="stage-note" id="stage-note" aria-live="polite"></span>
    </div>
  </main>
</div>

<script src="/assets/renderer.js"></script>
<script>
(() => {
  const S = window.AutoDesignSpecimen;
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const esc = S.escape;
  const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const app = {
    state: null,
    step: 0,
    visited: new Set([0]),
    preview: null,          // a specimen being previewed on the stage, not yet chosen
    previewName: "",
    stageMode: null,        // light or dark on the stage; defaults to the system's own
    compare: false,
    version: 0,             // bumps whenever the system changes, so cached options refresh
    variants: {},
    draftCopy: null,        // copy while typing the product name, before it's saved
    boardShown: false,
    feel: null,
    material: { images: [], colors: [], site: null },
    published: null,
    env: null,
  };

  /* ---------- Local server ---------- */
  async function api(path, body) {
    let res;
    try {
      res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    } catch {
      throw new Error("auto-design stopped running. Start it again with npx auto-design init.");
    }
    const data = await res.json().catch(() => ({ error: "The local server didn't answer. Is auto-design still running?" }));
    if (!res.ok || data.error) throw new Error(data.error || "Something went wrong");
    return data;
  }
  function status(msg, err) {
    const el = $("#status");
    el.textContent = msg || "";
    el.className = "status" + (err ? " err" : "");
  }
  function update(view) {
    Object.assign(app.state, view);
    app.version++;
    app.variants = {};
    app.draftCopy = null;
    paintTop();
  }
  async function choose(patch, label) {
    try { update(await api("/api/choose", { patch, label })); status(""); return true; }
    catch (e) { status(e.message, true); return false; }
  }
  async function variants(field) {
    const key = field + ":" + app.version;
    if (!app.variants[key]) app.variants[key] = api("/api/variants", { field });
    return app.variants[key];
  }
  const copy = () => app.draftCopy || app.state.copy;
  const current = () => app.state.specimen;

  /* ---------- Stage ---------- */
  const SURFACE_SCENE = { "web-app": "app", marketing: "hero", chat: "chat", code: "code", "mcp-apps": "mcp", messaging: "sms" };
  const site = () => (app.state.product.url || (app.state.product.name || "northwind").toLowerCase().replace(/[^a-z0-9]+/g, "") + ".com").replace(/^https?:\/\//, "").replace(/\/$/, "");

  /** The frames each step shows: the most telling view of that choice, plus context. */
  function layout(stepId) {
    const sf = app.state.surfaces;
    const title = copy().product;
    const phone = sf.includes("messaging");
    // The right column: a phone when texts are a surface, otherwise chat and one more panel.
    const side = phone ? [{ kind: "phone", scene: "sms", area: "side" }]
      : [sf.includes("chat") ? { kind: "panel", scene: "chat@l", area: "side" } : { kind: "panel", scene: "controls", area: "side" },
         sf.includes("code") ? { kind: "panel", scene: "code@l", area: "side2" } : sf.includes("mcp-apps") ? { kind: "panel", scene: "mcp", area: "side2" } : { kind: "panel", scene: "corners", area: "side2" }];
    const split = phone ? "" : " split";
    const hero = { kind: "browser", scene: "hero@m", area: "hero" };
    const appWin = { kind: "window", scene: "app@m", area: "app", title };
    switch (stepId) {
      case "texture": return { cls: "lay-focus" + split, frames: [{ kind: "window", scene: "surfaces", area: "main", title }, { kind: "browser", scene: "hero@s", area: "sub" }, ...side] };
      case "type": return { cls: "lay-focus" + split, frames: [{ kind: "browser", scene: "type", area: "main" }, { kind: "window", scene: "app@m", area: "sub", title }, ...side] };
      case "motion": return { cls: "lay-focus" + split, frames: [{ kind: "window", scene: "motion", area: "main", title, play: true }, { kind: "window", scene: "app@m", area: "sub", title }, ...side] };
      case "shape": return { cls: "lay-focus split", frames: [{ kind: "window", scene: "app@m", area: "main", title }, { kind: "browser", scene: "hero@s", area: "sub" }, { kind: "panel", scene: "corners", area: "side" }, { kind: "panel", scene: "controls", area: "side2" }] };
      case "color": return { cls: "lay-color", fixedModes: true, frames: [
        { kind: "window", scene: "app@m", area: "light", mode: "light", title: "Light" },
        { kind: "window", scene: "app@m", area: "dark", mode: "dark", title: "Dark" },
        { kind: "browser", scene: "hero@s", area: "hero" },
      ] };
      case "review": case "publish": {
        const extra = [];
        if (phone && sf.includes("chat")) extra.push({ kind: "panel", scene: "chat@l" });
        if (sf.includes("code") && !(side[1] && side[1].scene === "code@l")) extra.push({ kind: "panel", scene: "code@l" });
        if (sf.includes("mcp-apps") && !(side[1] && side[1].scene === "mcp")) extra.push({ kind: "panel", scene: "mcp" });
        extra.push({ kind: "window", scene: "dialog@m", title, wide: true });
        return { cls: "lay-review" + split, scroll: true, frames: [hero, appWin, ...side], extra };
      }
      default: return { cls: "lay-board" + split, frames: [hero, appWin, ...side] };
    }
  }

  function trimForNarrow(lay) {
    if (!narrow() || lay.scroll) return lay;
    return { ...lay, frames: lay.frames.filter((f) => f.kind !== "phone" || lay.frames.length < 3).slice(0, 2) };
  }

  function frameHtml(f, i) {
    const bar = f.kind === "browser" ? `<div class="fr-bar"><i></i><i></i><i></i><span class="url">${esc(site())}</span></div>`
      : f.kind === "window" ? `<div class="fr-bar"><i></i><i></i><i></i><span class="title">${esc(f.title || "")}</span></div>` : "";
    return `<div class="fr ${f.kind}${f.wide ? " wide" : ""}${f.area === "side2" ? " fill" : ""}" style="${f.area ? `grid-area:${f.area};` : ""}--i:${i}">${f.kind === "phone" ? '<span class="island"></span>' : ""}${bar}<div class="fr-body"><div></div></div></div>`;
  }

  /** Draw the stage. Same layout and markup: update variables so colors cross-fade. Otherwise rebuild. */
  function paint(spec = app.preview || current(), { rebuild = false } = {}) {
    if (!app.state) return;
    const board = $("#board");
    if (app.compare) return paintCompare();
    const lay = trimForNarrow(layout(STEPS[app.step].id));
    const mode = app.stageMode || spec.defaultMode;
    const c = JSON.stringify(copy());
    const key = [STEPS[app.step].id, app.state.surfaces.join(","), spec.texture === "glass" ? "g" : "", c.length, c.slice(0, 80), narrow()].join("|");
    const all = [...lay.frames, ...(lay.extra || [])];
    if (!rebuild && board.dataset.key === key && board.dataset.lay === lay.cls) {
      $$(".fr-body > .sp", board).forEach((el, i) => { S.apply(el, spec, all[i].mode || mode); if (all[i].play) S.play(el); });
      $("#stage").classList.toggle("fit", !lay.scroll && !narrow());
      return fit();
    }
    const first = !app.boardShown;
    clearInterval(app.playTimer);
    board.className = "board " + lay.cls + (narrow() ? " narrow" : "");
    board.style.width = boardWidth() + "px";
    board.innerHTML = lay.frames.map(frameHtml).join("") + (lay.extra ? `<div class="extra">${lay.extra.map((f, i) => frameHtml(f, i + lay.frames.length)).join("")}</div>` : "");
    $$(".fr-body > div", board).forEach((el, i) => {
      const f = all[i];
      S.render(el, spec, { mode: f.mode || mode, copy: copy(), scenes: [f.scene], size: "m" });
      if (f.play) { S.play(el); app.playTimer = setInterval(() => S.play(el), 3200); }
    });
    if (first && !reduced) { $$(".fr", board).forEach((f) => f.classList.add("enter")); app.boardShown = true; }
    board.dataset.key = key;
    board.dataset.lay = lay.cls;
    $("#stage").classList.toggle("fit", !lay.scroll && !narrow());
    $$("#stage-mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === mode)));
    $("#stage-mode").hidden = !!lay.fixedModes;
    fit();
  }

  const narrow = () => innerWidth < 700;
  const boardWidth = () => (narrow() ? 600 : 1280);

  /** Scale the board to the stage: whole board when it fits on screen, by width when it scrolls. */
  function fit() {
    const stage = $("#stage"), board = $("#board"), size = $("#board-size");
    const pad = innerWidth < 1080 ? 32 : 80;
    const w = stage.clientWidth - pad, hgt = stage.clientHeight - (innerWidth < 1080 ? 88 : 128);
    const natural = board.scrollHeight;
    const W = boardWidth();
    let k = w / W;
    if (stage.classList.contains("fit")) k = Math.min(k, hgt / natural);
    k = Math.max(0.2, Math.min(k, 1));
    board.style.transform = `scale(${k})`;
    size.style.width = W * k + "px";
    size.style.height = natural * k + "px";
  }
  let wasNarrow = null;
  new ResizeObserver(() => { if (app.state && wasNarrow !== null && wasNarrow !== narrow()) paint(undefined, { rebuild: true }); wasNarrow = narrow(); fit(); }).observe($("#stage"));

  function note(text) {
    const n = $("#stage-note");
    n.textContent = text || "";
    n.classList.toggle("on", !!text);
  }
  function previewOn(spec, name) {
    app.preview = spec;
    note(name ? `Previewing ${name}. Click to choose it.` : "");
    paint(spec);
  }
  function previewOff() {
    if (!app.preview) return;
    app.preview = null;
    note("");
    paint();
  }

  /* ---------- Compare: every option side by side on the stage ---------- */
  async function paintCompare() {
    const st = STEPS[app.step];
    const board = $("#board");
    if (!st.compare) { app.compare = false; return paint(); }
    $("#stage").classList.remove("fit");
    board.className = "board lay-compare";
    board.dataset.key = "";
    const list = await variants(st.compare.field);
    const mode = app.stageMode || current().defaultMode;
    const chosen = String(st.compare.current());
    board.innerHTML = "";
    list.forEach((v, i) => {
      const tile = h(`<button class="tile" aria-pressed="${String(v.value) === chosen}">${frameHtml({ kind: "panel" }, i)}<span class="lbl">${esc(v.name)}<small>${esc(v.note)}</small></span></button>`);
      const body = $(".fr-body > div", tile);
      if (v.specimen) S.render(body, v.specimen, { mode, copy: copy(), scenes: [st.compare.scene], size: "s" });
      else body.innerHTML = `<p class="error" style="padding:16px">${esc(v.error || "Can't build this option.")}</p>`;
      if (st.compare.scene === "motion") { S.play(body); }
      tile.onclick = async () => { if (!v.specimen) return; const ok = await st.compare.pick(v); if (ok !== false) { $$(".tile", board).forEach((t) => t.setAttribute("aria-pressed", String(t === tile))); syncSwatches(); } };
      board.append(tile);
    });
    fit();
  }
  function syncSwatches() { $$(".swatches[data-field]").forEach((w) => w.refresh && w.refresh()); }

  /* ---------- Swatches ---------- */
  const SURFACE_ICON = {
    "web-app": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M13 9h5M13 13h5"/></svg>',
    marketing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 8h18M7 13h8M7 16h5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4h0A2 2 0 0 1 4 14z"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>',
    "mcp-apps": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><rect x="7.5" y="9" width="9" height="7" rx="1.5"/></svg>',
    messaging: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>',
  };

  function sample(field, v) {
    switch (field) {
      case "preset": return '<span class="smp smp-preset"><i class="dot"></i><span class="aa">Aa</span><i class="bar"></i></span>';
      case "texture": return '<span class="smp smp-tex"><i class="card"></i><i class="pop"></i></span>';
      case "pairing": return '<span class="smp"><span class="smp-aa">Aa</span></span>';
      case "radius": return `<span class="smp smp-radius"><i class="shape" style="border-radius:${Math.min(Number(v.value) * 1.3, 18)}px"></i></span>`;
      case "density": return `<span class="smp smp-density" style="--gap:${v.value === "compact" ? 4 : 8}px"><i></i><i></i><i></i><i></i></span>`;
      case "motion": return `<span class="smp smp-motion" ${v.value === "still" ? "data-still" : ""}><i></i></span>`;
      default: return '<span class="smp"></span>';
    }
  }

  /**
   * A column of options for one field. Hovering or focusing an option shows it
   * on the stage; clicking keeps it.
   */
  async function swatches(container, field, { current: cur, pick, label }) {
    container.className = "swatches loading";
    container.dataset.field = field;
    container.setAttribute("role", "radiogroup");
    container.setAttribute("aria-label", label);
    container.innerHTML = Array.from({ length: 4 }, () => `<div class="sw"><span class="smp"></span><span><b>&nbsp;</b><span class="sw-note">&nbsp;</span></span></div>`).join("");
    let list;
    try { list = await variants(field); }
    catch (e) { container.className = "swatches"; container.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
    container.className = "swatches";
    container.innerHTML = "";
    const chosen = () => String(cur());
    list.forEach((v) => {
      const row = h(`<button class="sw${v.specimen ? "" : " err"}" role="radio" aria-checked="${String(v.value) === chosen()}">${sample(field, v)}<span><b>${esc(v.name)}</b><span class="sw-note">${esc(v.specimen ? v.note : v.error || v.note)}</span></span><i class="tick" aria-hidden="true"></i></button>`);
      const smp = $(".smp", row);
      if (v.specimen) { S.apply(smp, v.specimen, app.stageMode || v.specimen.defaultMode); smp.classList.add("smp"); }
      const show = () => { if (v.specimen && String(v.value) !== chosen()) previewOn(v.specimen, v.name); else previewOff(); };
      row.addEventListener("pointerenter", show);
      row.addEventListener("focus", show);
      row.addEventListener("click", async () => {
        if (!v.specimen) return;
        $$(".sw", container).forEach((r) => r.setAttribute("aria-checked", String(r === row)));
        const ok = await pick(v);
        app.preview = null;
        note("");
        if (ok === false) container.refresh();
        else paint();
      });
      container.append(row);
    });
    container.addEventListener("pointerleave", previewOff);
    container.addEventListener("focusout", (e) => { if (!container.contains(e.relatedTarget)) previewOff(); });
    container.refresh = () => $$(".sw", container).forEach((r, i) => r.setAttribute("aria-checked", String(String(list[i].value) === chosen())));
  }

  /* ---------- Steps ---------- */
  const PAIRING = (id) => (app.state.pairings.find((p) => p.id === id) || {}).name || id;
  const pickField = (field, label) => (v) => choose({ [field]: v.value }, `${label}: ${v.name}`);

  const STEPS = [
    {
      id: "product", tab: "Product",
      title: "What are you building?",
      help: "Its name and one line about it. Every preview from here on is your product, not a sample.",
      value: () => app.state.product.name,
      render(root) {
        const p = app.state.product;
        root.append(h(`<div>

  /** A headline from a description: its first sentence, or first clause if long. Mirrors the server. */
  function sentence(text) {
    const first = text.split(/(?<=[.!?])\s+/)[0].replace(/[.\s]+$/, "");
    const words = (t) => t.split(/\s+/).filter(Boolean).length;
    const pick = words(first) <= 10 ? first : first.split(/,\s+|\s+[—–-]\s+|:\s+/)[0];
    if (words(pick) < 2 || words(pick) > 10) return "";
    return pick.charAt(0).toUpperCase() + pick.slice(1) + ".";
  }

  function loadImage(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
  }
  function shrink(img) {
    const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return { mediaType: "image/jpeg", data: c.toDataURL("image/jpeg", 0.86).split(",")[1] };
  }
  function dominant(img) {
    const c = document.createElement("canvas");
    const k = Math.min(1, 96 / Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    const buckets = new Map();
    for (let i = 0; i < d.length; i += 4) {
      const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]];
      if (a < 200) continue;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      if (max - min < 28 || (max > 245 && min > 230) || max < 24) continue;
      const key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      const e = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
      e.n++; e.r += r; e.g += g; e.b += b; buckets.set(key, e);
    }
    const hex = (v) => Math.round(v).toString(16).padStart(2, "0");
    return [...buckets.values()].sort((a, b) => b.n - a.n).slice(0, 3).map((e) => `#${hex(e.r / e.n)}${hex(e.g / e.n)}${hex(e.b / e.n)}`);
  }

  /* ---------- Color ---------- */
  const CMAX = 0.37;
  const STARTERS = [
    ["Cobalt", "oklch(0.49 0.13 256)"], ["Forest", "oklch(0.42 0.08 158)"], ["Crimson", "oklch(0.53 0.19 22)"], ["Signal", "oklch(0.64 0.18 45)"],

  ];
  function oklchToRgb(l, c, hh) {
    const hr = (hh * Math.PI) / 180, a = c * Math.cos(hr), b = c * Math.sin(hr);
    const L = (l + 0.3963377774 * a + 0.2158037573 * b) ** 3, M = (l - 0.1055613458 * a - 0.0638541728 * b) ** 3, Sx = (l - 0.0894841775 * a - 1.291485548 * b) ** 3;
    return [4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * Sx, -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * Sx, -0.0041960863 * L - 0.7034186147 * M + 1.707614701 * Sx]
      .map((x) => (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.sign(x) * Math.abs(x) ** (1 / 2.4) - 0.055));
  }
  const inGamut = (rgb) => rgb.every((v) => v >= -0.0008 && v <= 1.0008);
  function maxChroma(l, hh) { let lo = 0, hi = CMAX; for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; if (inGamut(oklchToRgb(l, mid, hh))) lo = mid; else hi = mid; } return lo; }

  async function go(i) {

    book.innerHTML = "";
    book.scrollTop = 0;
    book.append(h(`<h1 class="q">${esc(st.title)}</h1>`));
    book.append(h(`<p class="help">${esc(st.help)}</p>`));
    const body = document.createElement("div");
    book.append(body);
    if (!st.compare) app.compare = false;
    $("#compare-seg").hidden = !st.compare;
    $$("#compare-seg button").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.v === "compare") === app.compare)));
    st.render(body);
    $("#back").hidden = app.step === 0 || !!app.published;
    $("#next").hidden = !!app.published;
    $(".book-foot").hidden = !!app.published;
    $("#next").textContent = st.nextLabel ? st.nextLabel() : "Continue";
    status("");
    paintTop();
    paint();
  }

  $("#next").onclick = () => (STEPS[app.step].id === "publish" ? doPublish() : go(app.step + 1));
  $("#back").onclick = () => go(app.step - 1);
  $("#model-pill").onclick = () => { go(0).then(() => { const d = $("details.more"); if (d) d.open = true; }); };
  $("#undo").onclick = async () => {
    try {
      const r = await api("/api/undo", {});
      update(r);
      status(r.undone ? `Undid “${r.undone}”.` : "");
      if (STEPS[app.step].id === "review" && app.afterUndo) app.afterUndo();
      else rerender();
    } catch (e) { status(e.message, true); }
  };
  $$("#stage-mode button").forEach((b) => (b.onclick = () => { app.stageMode = b.dataset.v; paint(); $$(".swatches .smp.sp").forEach(() => {}); }));
  $$("#compare-seg button").forEach((b) => (b.onclick = () => {
    app.compare = b.dataset.v === "compare";
    $$("#compare-seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    previewOff();
    paint(undefined, { rebuild: true });
  }));
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && app.state && app.state.history.length) { e.preventDefault(); $("#undo").click(); }
  });

  (async () => {
    try {
      app.state = await api("/api/state");
      for (const href of app.state.fonts) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.append(l); }
      rerender();
      if (document.fonts) document.fonts.ready.then(() => fit());
    } catch (e) {
      $("#book").innerHTML = `<p class="error">${esc(e.message)}</p>`;
    }
  })();
})();
</script>
</body>
</html>
