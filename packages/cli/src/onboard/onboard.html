    const hosts = [
      ["pages", "GitHub Pages", "Public and free. Rebuilds on every push."],
      ["vercel", "Vercel", "Public, or private with Vercel’s protection."],
      ["railway", "Railway", "Private: a small server that checks a token."],
      ["render", "Render", "Private: the same token server, set up from a blueprint."],
      ["intranet", "Our intranet", "A static folder to put behind your sign-on."],
      ["later", "Decide later", "Just the repo for now."],
    ];
    app.hosting = app.hosting || "pages";
    const paintHosts = () => {
      $("#hosting").innerHTML = "";
      for (const [id, name, note] of hosts) {
        const c = h(`<button class="choice" aria-pressed="${id === app.hosting}"><b>${esc(name)}</b><span>${esc(note)}</span></button>`);
        c.onclick = () => { app.hosting = id; paintHosts(); };
        $("#hosting").append(c);
      }
    };
    paintHosts();
    try { app.env = app.env || (await api("/api/publish/env")); } catch { app.env = { git: false, gh: {}, vercel: {} }; }
    const env = app.env;
    const gh = $("#gh-area");
    if (!env.git) gh.innerHTML = `<p class="error">git isn’t installed, so the folder will be written but not committed or pushed.</p>`;
    else if (env.gh.user) {
      app.github = app.github || "gh";
      gh.innerHTML = `<label class="row"><input type="checkbox" id="use-gh" ${app.github === "gh" ? "checked" : ""}><span>Create <b>${esc(env.gh.user)}/<span id="repo-preview">${esc(s.name)}-design</span></b> with the GitHub CLI</span></label>
        <div class="seg" id="vis" style="margin-top:8px"><button data-v="public" aria-pressed="true">Public</button><button data-v="private" aria-pressed="false">Private</button></div>`;
    } else {
      app.github = app.github || "token";
      gh.innerHTML = `<p class="note">${env.gh.installed ? "The GitHub CLI isn’t signed in." : "The GitHub CLI isn’t installed."} Run <code>gh auth login</code> and reload, or paste a token with permission to create repositories.</p>
        <input class="input mono" id="gh-token" type="password" placeholder="github_pat_…" autocomplete="off" style="margin-top:8px">
        <div class="seg" id="vis" style="margin-top:8px"><button data-v="public" aria-pressed="true">Public</button><button data-v="private" aria-pressed="false">Private</button></div>
        <label class="row note" style="margin-top:8px"><input type="checkbox" id="skip-gh"><span>Skip GitHub; just write and commit the folder</span></label>`;
    }
    app.visibility = "public";
    gh.querySelectorAll("#vis button").forEach((b) => b.onclick = () => { app.visibility = b.dataset.v; gh.querySelectorAll("#vis button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
    $("#pub-dir").addEventListener("input", () => { const rp = $("#repo-preview"); if (rp) rp.textContent = ($("#pub-dir").value.split(/[\\/]/).filter(Boolean).pop() || s.name + "-design"); });
  }

  async function doPublish() {
    const s = app.state;
    const useGh = $("#use-gh") ? $("#use-gh").checked : false;
    const token = $("#gh-token") ? $("#gh-token").value.trim() : "";
    const skip = $("#skip-gh") ? $("#skip-gh").checked : false;
    const github = useGh ? "gh" : token && !skip ? "token" : "none";
    const dir = $("#pub-dir").value.trim();
    status("Creating the design system…");
    $("#next").disabled = true;
    try {
      const r = await api("/api/publish", {
        dir, displayName: $("#pub-name").value.trim() || s.displayName, visibility: app.visibility, github, token,
        repoName: dir.split(/[\\/]/).filter(Boolean).pop(), hosting: app.hosting, saveKey: $("#save-key") ? $("#save-key").checked : false,
      });
      app.published = r;
      status("");
      paintRail();
      rerender();
      $("#next").hidden = true;
      $("#back").hidden = true;
      $(".actions").classList.add("done");
    } catch (e) { status(e.message, true); }
    finally { $("#next").disabled = false; }
  }

  function renderDone(root) {
    const r = app.published, s = app.state;
    const head = $(".step-head");
    const hasSite = r.steps.some((x) => x.step === "Build the design site" && x.ok);
    if (head) head.innerHTML = `<h1>${esc(s.displayName)} is ready</h1><p>${r.steps.every((x) => x.ok) ? "Everything below is done." : "Most of it is done; the steps marked in red need you."} ${hasSite ? "Its design site has a page for every foundation and component, drawn with the system itself." : "Install it in an app, tell your agents about it, and keep refining in the studio."}</p>`;
    const src = r.registryUrl || r.dir;
    const agent = `Before writing or changing UI, read DESIGN.md. It is the ${s.displayName} design system.\nAfter every change run \`npx auto-design check\` and fix what it reports.`;
    root.append(h(`<div class="publish"><div class="form" style="max-width:640px">
      ${hasSite ? `<div class="row" style="margin-bottom:20px"><a class="btn ink" id="open-site" href="/site/" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;text-decoration:none">Open the design site</a></div>` : ""}
      <div class="steps-out">${r.steps.map((st) => `<div class="${st.ok ? "" : "bad"}"><i aria-hidden="true"></i><div><b>${esc(st.step)}</b><small>${esc(st.detail)}${st.url ? ` <a href="${esc(st.url)}" target="_blank" rel="noreferrer">${esc(st.url.replace(/^https:\/\//, ""))}</a>` : ""}</small></div></div>`).join("")}</div>
      <p class="section-label">Install it in an app</p>
      <div class="copy-row"><pre class="cmd">npx auto-design add ${esc(src)} --components all</pre><button class="btn line small" data-copy="npx auto-design add ${esc(src)} --components all">Copy</button></div>
      <p class="note">Then check the app against the system with <code>npx auto-design check</code>.</p>
      <p class="section-label">Tell your agents</p>
      <p class="note">Add this to AGENTS.md or CLAUDE.md in each app. <code>add</code> does it for you.</p>
      <div class="copy-row"><pre class="cmd">${esc(agent)}</pre><button class="btn line small" data-copy="${esc(agent)}">Copy</button></div>
      <p class="section-label">Keep refining</p>
      <div class="row"><button class="btn ${hasSite ? "line" : "ink"} small" id="open-studio">Open the studio</button>${r.repoUrl ? `<a class="btn line small" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(r.repoUrl)}" target="_blank" rel="noreferrer">View on GitHub</a>` : ""}</div>
      <p class="note">Or run <code>npx auto-design dev --cwd ${esc(r.relDir)}</code> any time.</p>
    </div><div class="big-view" id="done-view" style="height:360px"></div></div>`));
    draw($("#done-view"), s.specimen, ["object"], { size: "m" });
    root.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1400); } catch {} });
    $("#open-studio").onclick = async () => { try { const x = await api("/api/studio", {}); location.href = x.url; } catch (e) { status(e.message, true); } };
  }

  /* ---------- Frame ---------- */
  function clear(el) { el.innerHTML = ""; return el; }
  function paintBar() {
    const s = app.state;
    $("#bar-product").textContent = s.product.name || "";
    const pill = $("#model-pill");
    pill.classList.toggle("on", !!s.model);
    $("span", pill).textContent = s.model ? s.model.label : "No model";
    $("#undo").hidden = !s.history.length;
  }
  function paintRail() {
    const ol = $("#rail");
    ol.innerHTML = "";
    STEPS.forEach((st, i) => {
      const value = app.visited.has(i) && i !== app.step ? st.value() : "";
      const done = app.visited.has(i) && i < app.step;
      const dot = st.dot && value ? `<i class="dot" style="background:${esc(st.dot())}"></i>` : "";
      const li = h(`<li><button class="${done ? "done" : ""}" ${i === app.step ? 'aria-current="step"' : ""}><b>${esc(st.rail)}</b>${value ? `<small>${dot}${esc(value)}</small>` : ""}</button></li>`);
      $("button", li).onclick = () => go(i);
      ol.append(li);
    });
  }
  async function go(i) {
    if (i === app.step) return;
    const cur = STEPS[app.step];
    if (cur.leave && i > app.step) {
      try { const ok = await cur.leave(); if (ok === false) return; } catch (e) { status(e.message, true); return; }
    } else if (cur.id === "color" && app.colorDirty) {
      await commitColor();
    }
    if (cur.id === "feel" && i < app.step && app.feel && Object.keys(feelPatch()).length) await choose(feelPatch(), "Set the feel");
    app.step = Math.max(0, Math.min(STEPS.length - 1, i));
    app.visited.add(app.step);
    rerender();
    window.scrollTo({ top: 0 });
    $("#step").focus({ preventScroll: true });
  }
  function rerender() {
    stopTimers();
    const st = STEPS[app.step];
    const root = clear($("#step"));
    const head = h(`<div class="step-head"><div class="txt"><h1>${esc(st.title)}</h1><p>${esc(st.help)}</p></div></div>`);
    if (st.modes && !app.published) {
      const seg = h(`<div class="seg modes" role="group" aria-label="Preview mode">${[[null, "As designed"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => `<button data-v="${v || ""}" aria-pressed="${(app.previewMode || "") === (v || "")}">${l}</button>`).join("")}</div>`);
      seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; app.previewMode = b.dataset.v || null; rerender(); });
      head.append(seg);
    }
    root.append(head);
    const prog = $("#progress");
    prog.style.setProperty("--p", String((app.step + 1) / STEPS.length));
    prog.setAttribute("aria-valuenow", String(app.step + 1));
    prog.setAttribute("aria-valuemax", String(STEPS.length));
    prog.setAttribute("aria-valuetext", `Step ${app.step + 1} of ${STEPS.length}: ${st.rail}`);
    prog.title = `Step ${app.step + 1} of ${STEPS.length}`;
    const body = document.createElement("div");
    root.append(body);
    st.render(body);
    $("#back").hidden = app.step === 0 || !!app.published;
    $("#next").hidden = !!(app.published && st.id === "publish");
    $(".actions").classList.toggle("done", !!(app.published && st.id === "publish"));
    $("#next").textContent = st.nextLabel ? st.nextLabel() : "Continue";
    status("");
    paintBar();
    paintRail();
  }

  $("#next").onclick = () => (STEPS[app.step].id === "publish" ? doPublish() : go(app.step + 1));
  $("#back").onclick = () => go(app.step - 1);
  $("#undo").onclick = async () => {
    try {
      const r = await api("/api/undo", {});
      update(r);
      status(r.undone ? `Undid “${r.undone}”.` : "");
      if (STEPS[app.step].id === "review" && app.repaintReview) app.repaintReview();
      else rerender();
    } catch (e) { status(e.message, true); }
  };
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && app.state.history.length) { e.preventDefault(); $("#undo").click(); }
  });

  (async () => {
    try {
      app.state = await api("/api/state");
      for (const href of app.state.fonts) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.append(l); }
      rerender();
    } catch (e) {
      $("#step").innerHTML = `<p class="error">${esc(e.message)}</p>`;
    }
  })();
})();
</script>
</body>
</html>
